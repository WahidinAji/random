services:
  phrasedeck:
    build:
      context: .
      args:
        PIPER_VOICE: en_US-lessac-medium   # ganti ke en_GB-alba-medium kalau mau aksen British
    container_name: phrasedeck
    restart: unless-stopped
    ports:
      - "192.168.1.6:8082:8080"
    environment:
      - APP_PASSWORD=   # isi kalau mau pakai password, kosongkan kalau tidak
    volumes:
      - ./data:/data
